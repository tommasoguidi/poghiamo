{% extends "base.html" %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center p-6">
    <div class="w-full max-w-sm">

        <div class="flex flex-col items-center mb-10">
            <h1 class="text-3xl font-bold tracking-tight text-cream mb-2">poghiamo</h1>
            <p class="text-sm text-zinc-400">Invite-only. Ask a friend for a code.</p>
        </div>

        <div class="bg-card rounded-2xl p-8 shadow-xl border border-zinc-800">
            <h2 class="text-xl font-semibold text-cream mb-8 text-center">Sign up</h2>

            {% if error %}
            <div class="mb-6 px-4 py-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form action="/signup" method="POST" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-zinc-400 ml-1" for="invite_code">Invite code</label>
                    <input type="text" name="invite_code" id="invite_code" value="{{ invite or '' }}"
                           class="block w-full px-4 py-3 bg-zinc-900 border border-zinc-700 text-cream rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                           placeholder="bright-forest-42" required>
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-zinc-400 ml-1" for="username">Username</label>
                    <input type="text" name="username" id="username" minlength="3"
                           class="block w-full px-4 py-3 bg-zinc-900 border border-zinc-700 text-cream rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                           placeholder="your_username" required autocomplete="username">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-zinc-400 ml-1" for="password">Password</label>
                    <input type="password" name="password" id="password" minlength="8"
                           class="block w-full px-4 py-3 bg-zinc-900 border border-zinc-700 text-cream rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                           placeholder="min 8 characters" required autocomplete="new-password">
                </div>
                <div class="space-y-1.5">
                    <label class="block text-xs font-medium text-zinc-400 ml-1" for="confirm_password">Confirm password</label>
                    <input type="password" name="confirm_password" id="confirm_password" minlength="8"
                           class="block w-full px-4 py-3 bg-zinc-900 border border-zinc-700 text-cream rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                           placeholder="repeat it" required autocomplete="new-password">
                </div>
                <button type="submit"
                        class="w-full bg-primary hover:bg-rose-600 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-rose-500/20 active:scale-95 transition-all mt-2">
                    Create account
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-zinc-400">
                    Already in?
                    <a href="/login" class="text-primary font-medium hover:underline underline-offset-4">Login</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
