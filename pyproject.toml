[project]
name = "poghiamo"
version = "0.1.0"
description = "Concert tracker for niche Italian artists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "schedule>=1.2.0",
    "bcrypt>=4.0.0,<5.0.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "httpx>=0.27.0"]

[project.scripts]
poghiamo-web = "poghiamo.webapp.app:main"
poghiamo-scheduler = "poghiamo.scheduler.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poghiamo"]
# tailwind.css is generated (gitignored); include it in the wheel when present.
artifacts = ["src/poghiamo/webapp/static/tailwind.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
